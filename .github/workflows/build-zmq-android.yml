name: Build ZMQ for Android

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]

    env:
      ANDROID_API: 21
      ZMQ_VERSION: 4.3.5
      NDK_VERSION: 25.2.9519653

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    # Java 17 is REQUIRED for modern sdkmanager
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Install SDK components
      run: |
        sdkmanager \
          "platforms;android-${ANDROID_API}" \
          "build-tools;33.0.2" \
          "ndk;${NDK_VERSION}"

    - name: Fetch ZeroMQ
      run: |
        curl -L https://github.com/zeromq/libzmq/releases/download/v${ZMQ_VERSION}/zeromq-${ZMQ_VERSION}.tar.gz \
          -o zmq.tar.gz
        tar -xf zmq.tar.gz

    - name: Configure & Build
      working-directory: zeromq-${ZMQ_VERSION}
      run: |
        mkdir -p build-${{ matrix.abi }}
        cd build-${{ matrix.abi }}

        cmake \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ matrix.abi }} \
          -DANDROID_PLATFORM=android-${ANDROID_API} \
          -DBUILD_SHARED=OFF \
          -DCMAKE_BUILD_TYPE=Release \
          ..

        cmake --build . -- -j$(nproc)

    - name: Collect output
      run: |
        mkdir -p output/${{ matrix.abi }}
        cp zeromq-${ZMQ_VERSION}/build-${{ matrix.abi }}/libzmq.a output/${{ matrix.abi }}/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: libzmq-${{ matrix.abi }}
        path: output/${{ matrix.abi }}
